source: content/raw/2026-07-06-愛人與被愛都不該是幻覺gai2026-年會感想和其他有的沒的.md
timestamp: '2026-07-06'
topics:
- name: AI
  stance: 作者肯定 AI 與 agent 工具在工作上能提升效率、建立脈絡（context），但堅決劃清界線：AI 無法取代人類的擁抱、陪伴與真實情感連結。
  tension: 科技帶來的效率與便利 vs. 對人類情感被取代、異化的擔憂
  shift_signal: null
  key_quote: AI 無法代替人類擁抱∕無法代替人類派對∕愛與被愛都不應該是幻覺
- name: 工作
  stance: 重視同事間長期合作累積的信任與脈絡，認為「蒸餾」專業成 .md 檔雖有效率，卻可能讓人只剩「能力」而非完整的人；但觀察到業界決策者仍努力以人為本。
  tension: 技術允許朝異化狂奔 vs. 老闆與決策者更以人為本的實際選擇
  shift_signal: null
  key_quote: 我只需要跟你的能力工作，而不需要跟你合作。
- name: 身份
  stance: 身體的疼痛（椎間盤突出）迫使作者重新丈量自己與物理世界、與家人之間的距離與時間，在阿媽與醫院眾生相中確認真實自我的位置。
  tension: null
  shift_signal: 椎間盤突出引發的身體疼痛讓作者重新感知時間與距離
  key_quote: 疼痛逼得我重新量測身處物理世界中的距離和時間。
- name: 愛
  stance: 愛必須是真實、雙向的「承認」而非單方面的投射或消費，作者強烈反對機器人伴侶、詐騙式愛情等「生成式」幻覺愛情，即使自己對於如何去愛仍感困窘脆弱。
  tension: 渴望被對等看見、承認的愛 vs. 現實中愛情市場化、幻覺化、資本化的趨勢
  shift_signal: null
  key_quote: 愛人與被愛都不該是幻覺
- name: 文化
  stance: 推崇誠實、不販賣焦慮的策展品味，認為真正有影響力的社群不靠「改革、顛覆、效率」這類焦慮話術建立，而是由真實的人與真實的互動構成，且相信「不可規模化」的事物很重要。
  tension: 效率至上、販賣焦慮的產業話語 vs. 誠實、以人為本、不可規模化的社群價值
  shift_signal: null
  key_quote: 改革、顛覆、效率、變革這種類型的文字，隱約都在販賣焦慮，看著是覺得有點煩。
- name: 學習
  stance: 成長不是追逐未來或被恐懼驅動，而是持續整理過去的自己，找到與世界互動最好的方式，再逐步把關心的範圍從小擴大到大。
  tension: 對未來的焦慮作為生存本能 vs. 拒絕讓焦慮主導生命
  shift_signal: null
  key_quote: 未來會怎麼來？我不知道。只能持續地整理過去的自己，來看看怎麼樣跟社會互動是我最好的方式
connections:
- 工作中談的「脈絡」概念延伸到學習裡「整理過去的自己」，兩者都強調真實累積而非速成蒸餾
- 愛與身份主題都圍繞著「真實 vs. 幻覺」的核心張力，從機器人伴侶到阿媽與老夫婦的真實陪伴形成對照
- 文化中反對販賣焦慮的策展品味，呼應學習裡拒絕讓恐懼驅動生命的態度
keywords:
