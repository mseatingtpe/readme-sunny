name: Update README

on:
  schedule:
    - cron: '0 1 * * *'  # 每天 UTC 01:00（台灣 09:00）
  workflow_dispatch:  # 手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch new Substack articles
        run: python scripts/fetch_substack.py

      - name: Check for new content
        id: check
        run: |
          # Check both git diff (from fetch) and unextracted files
          has_new=false
          if ! git diff --quiet content/raw/; then
            has_new=true
          fi
          for f in content/raw/*.md; do
            [ "$(basename "$f")" != "_*" ] || continue
            stem="$(basename "$f" .md)"
            if [ ! -f "content/extractions/${stem}.yaml" ]; then
              has_new=true
              break
            fi
          done
          echo "new_content=${has_new}" >> "$GITHUB_OUTPUT"

      - name: Extract worldview dimensions
        if: steps.check.outputs.new_content == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/extract.py --all

      - name: Generate Skill (update dynamics only)
        if: steps.check.outputs.new_content == 'true'
        run: python scripts/generate_skill.py --update-dynamics

      - name: Generate README
        run: python scripts/generate_readme.py

      - name: Generate dashboard data
        run: |
          python scripts/generate_dashboard_data.py
          if [ -f scripts/generate_wordcloud.py ]; then
            pip install jieba 2>/dev/null || true
            python scripts/generate_wordcloud.py || true
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: update content and README"
            git push
          fi
